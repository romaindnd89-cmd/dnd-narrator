    <link rel="manifest" href="/manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=MedievalSharp&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'blood-red': '#8a0303',
              'blood-dark': '#4a0101',
              'gold-antique': '#c5a059',
              'gold-dark': '#8a6e36',
              'parchment': '#f0e6d2',
              'parchment-dark': '#dcd0b9',
              'dark-metal': '#1a1b1e',
              'darker-metal': '#0f1012',
            },
            fontFamily: {
              fantasy: ['"MedievalSharp"', 'cursive'],
              header: ['"Cinzel"', 'serif'],
              body: ['"Merriweather"', 'serif'],
            },
            boxShadow: {
              'glow-gold': '0 0 15px rgba(197, 160, 89, 0.3)',
              'glow-red': '0 0 20px rgba(138, 3, 3, 0.4)',
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #000000;
        background-image: radial-gradient(circle at 50% 50%, #111111 0%, #000000 100%);
        color: #dcd0b9;
        overscroll-behavior-y: none;
      }
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #050505; }
      ::-webkit-scrollbar-thumb { background: #4a0101; border: 1px solid #8a6e36; border-radius: 4px; }
      @keyframes fade-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in { animation: fade-in 0.8s ease-out forwards; }
      @keyframes pulse-gold {
        0%, 100% { box-shadow: 0 0 5px rgba(197, 160, 89, 0.2); }
        50% { box-shadow: 0 0 20px rgba(197, 160, 89, 0.5); }
      }
      .animate-pulse-gold { animation: pulse-gold 2s infinite; }
    </style>
